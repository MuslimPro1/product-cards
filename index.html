<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <title>product-card</title>
  </head>

  <body>
    <div class="page">
      <h1 class="main-title">Выбери свой продукт</h1>
      <button id="recolor-first-card-button">
        Перекрасить фон первой карточки
      </button>
      <button id="recolor-all-card-button">
        Перекрасить фон всех карточек
      </button>
      <button id="open-google-button">Открыть Google</button>
      <button id="change-color-button">Поменять цвет кнопки</button>

      <div class="product-card-wrapper">
        <template class="product-card-temlate">
          <div class="product-card">
            <img src="" class="product-card__img" alt="" />
            <p class="product-card__for-skin"></p>
            <h2 class="product-card__title"></h2>
            <p class="product-card__description"></p>
            <p class="product-card__composition-title">Состав:</p>
            <ul class="product-card__composition-list"></ul>
            <div class="product-card__price-wrapper">
              <span class="product-card__price-text">Цена</span>
              <div>
                <span class="product-card__price">;</span>
                <span class="product-card__price-val">&#8381;</span>
              </div>
            </div>
          </div>
        </template>
        <div class="background"></div>
      </div>
    </div>
    <script src="./script.js"></script>
    <script src="./homework-5.js"></script>
    <script src="./homework-6.js"></script>
    <script src="./homework-7.js" type="module"></script>
    <script src="./homework-8.js" type="module"></script>
    <script src="./product-cards.js" type="module"></script>
  </body>
</html>
